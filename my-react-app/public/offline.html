<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8fd0f7" />
    <title>You're offline | Pro Coder</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        place-items: center;
        color: #1b2a49;
        background: linear-gradient(180deg, #8fd0f7 0%, #c4e7fc 50%, #eaf6ff 100%);
        font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      main {
        width: min(100%, 24rem);
        border: 3px solid #1b2a49;
        border-radius: 28px;
        padding: 2rem 1.5rem;
        background: #fff;
        box-shadow: 0 6px 0 #1b2a49;
      }
      svg { width: 96px; height: 96px; }
      h1 { margin: 0.75rem 0 0.25rem; font-size: 1.6rem; }
      p { margin: 0 0 0.25rem; line-height: 1.5; }
      .bn { color: #4c5c7a; }
      button {
        margin-top: 1.25rem;
        border: 3px solid #1b2a49;
        border-radius: 999px;
        padding: 0.75rem 1.5rem;
        color: #fff;
        background: #d42a37;
        box-shadow: 0 4px 0 #1b2a49;
        font: inherit;
        font-size: 1.1rem;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M14 44 L3 50 Q2 55 7 56 L19 51 Z" fill="#5c4a40" stroke="#1b2a49" stroke-width="2.5" stroke-linejoin="round" />
        <path d="M27 17 C23 11 23 5 27 1 C29 6 33 8 38 9 C35 11 36 14 39 16 Z" fill="#1b2a49" />
        <ellipse cx="34" cy="38" rx="21" ry="20" fill="#8a7466" stroke="#1b2a49" stroke-width="3" />
        <path d="M15 31 C16 20 24 14 34 14 C44 14 51 21 53 30 C47 33 41 35 34 34 C27 33 20 31 15 31 Z" fill="#1b2a49" />
        <circle cx="41" cy="25" r="4.6" fill="#fff" />
        <circle cx="42" cy="25.5" r="2.3" fill="#1b2a49" />
        <path d="M51 27 L62 31 L51 35 Z" fill="#f2b33d" stroke="#1b2a49" stroke-width="2" stroke-linejoin="round" />
        <path d="M16 46 C18 53 23 57 29 57 C26 52 22 48 16 46 Z" fill="#e4333f" stroke="#1b2a49" stroke-width="2" stroke-linejoin="round" />
      </svg>
      <h1>You're offline</h1>
      <p>Pro Coder needs the internet to load games. Check your connection and try again.</p>
      <p class="bn" lang="bn">ইন্টারনেট সংযোগ নেই। সংযোগ দেখে আবার চেষ্টা করো।</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
