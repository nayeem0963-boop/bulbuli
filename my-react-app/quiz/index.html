<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Learning Quiz</title>
  <style>
    /* ===== Design tokens ===== */
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #273449;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --code-bg: #0b1220;
      --radius: 12px;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: "Fira Code", Consolas, "Courier New", monospace;
      /* Level colours */
      --lvl1: #38bdf8;
      --lvl2: #a78bfa;
      --lvl3: #f472b6;
      --lvl4: #fb923c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Fluid root size: every rem in this file grows a little on big screens,
       and a little more in fullscreen (see html.is-fullscreen below). */
    html {
      font-size: clamp(16px, 0.3vw + 13px, 18px);
      background: var(--bg);
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: clamp(16px, 3vw, 40px) clamp(12px, 3vw, 40px);
      line-height: 1.5;
    }

    .app { width: 100%; max-width: 1100px; }
    [hidden] { display: none !important; }

    /* ===== Header Bar ===== */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem 1.1rem;
      font-weight: 600;
    }
    .stat { font-size: 0.95rem; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .fs-btn {
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.3rem 0.7rem;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s, background 0.15s;
    }
    .fs-btn:hover { border-color: var(--accent); }
    .fs-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .fs-icon { display: inline-block; width: 1.1em; text-align: center; }
    .score { color: var(--warning); }
    .timer {
      font-family: var(--mono);
      background: var(--surface-2);
      padding: 4px 10px;
      border-radius: 8px;
    }
    .timer.low { color: var(--danger); animation: pulse 1s ease-in-out infinite; }
    .timer.paused { color: var(--muted); animation: none; }
    .timer.done { color: var(--success); animation: none; }
    .timer.expired { color: var(--danger); animation: none; }

    .progress-track {
      height: 6px;
      background: var(--surface);
      border-radius: 99px;
      margin: 10px 0 20px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    /* ===== Question Card ===== */
    .question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: clamp(1.25rem, 2.5vw, 2rem);
      margin-bottom: 1.25rem;
    }
    .level-banner {
      margin: -4px 0 14px;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      background: color-mix(in srgb, var(--lvl-color) 14%, transparent);
      border-left: 3px solid var(--lvl-color);
      animation: slideIn 0.4s ease;
    }
    .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .tag {
      display: inline-block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 10px;
      border-radius: 99px;
    }
    .level-tag {
      color: var(--lvl-color);
      background: color-mix(in srgb, var(--lvl-color) 15%, transparent);
    }
    .topic-tag { color: var(--muted); background: var(--surface-2); }
    .question-text { font-size: 1.2rem; font-weight: 500; }

    /* Shared code styles */
    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem 1rem;
      overflow-x: auto;
      margin: 0.75rem 0;
      line-height: 1.55;
    }
    code { font-family: var(--mono); font-size: 0.9rem; color: #a5f3fc; }
    :not(pre) > code { background: var(--surface-2); padding: 1px 6px; border-radius: 4px; }

    /* ===== Options Grid ===== */
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(10px, 1.2vw, 16px); }
    .option-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      background: var(--surface);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 0.9rem 1rem;
      min-height: 3.6rem;
      font: inherit;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
    }
    .option-btn:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
    .option-btn:disabled { cursor: default; }
    .option-letter {
      flex-shrink: 0;
      width: 2rem; height: 2rem;
      display: grid; place-items: center;
      background: var(--surface-2);
      border-radius: 8px;
      font-weight: 700;
    }
    .option-label { overflow-wrap: anywhere; }
    .option-label.is-code { font-family: var(--mono); font-size: 0.95rem; color: #a5f3fc; }
    .option-btn.correct {
      border-color: var(--success);
      background: rgba(34, 197, 94, 0.2);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.25);
      animation: pop 0.35s ease;
    }
    .option-btn.correct .option-letter { background: var(--success); color: #fff; }
    .option-btn.wrong {
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
      opacity: 0.7;
      animation: shake 0.35s ease;
    }
    .option-btn.wrong .option-letter { background: var(--danger); color: #fff; }

    /* ===== Feedback ===== */
    .feedback { min-height: 1.5em; margin: 14px 4px; font-weight: 500; }
    .feedback.success { color: var(--success); }
    .feedback.error { color: var(--danger); }

    /* ===== Action Bar ===== */
    .action-bar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .btn {
      font: inherit;
      font-weight: 600;
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--warning); }

    .score-bump { animation: bump 0.5s ease; display: inline-block; }

    /* ===== Reading Drawer ===== */
    .drawer-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); z-index: 10; }
    .drawer {
      position: fixed;
      top: 0; right: 0;
      height: 100%;
      width: min(clamp(420px, 42vw, 680px), 100%);
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 20;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      visibility: hidden;
    }
    .drawer.open { transform: translateX(0); visibility: visible; }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
    }
    .drawer-close { background: none; border: none; color: var(--muted); font-size: 1.3rem; cursor: pointer; }
    .drawer-close:hover { color: var(--text); }
    .drawer-hint {
      margin: 16px 20px 0;
      padding: 12px 14px;
      background: rgba(245, 158, 11, 0.1);
      border-left: 3px solid var(--warning);
      border-radius: 6px;
    }
    .drawer-body { flex: 1; padding: 16px 20px 32px; overflow-y: auto; }
    .drawer-body h3 { margin: 18px 0 8px; color: #c7d2fe; }
    .drawer-body h3:first-child { margin-top: 4px; }
    .drawer-body p, .drawer-body ul, .drawer-body ol, .drawer-body table { margin-bottom: 10px; }
    .drawer-body ul, .drawer-body ol { padding-left: 22px; }
    .drawer-body li { margin-bottom: 4px; }
    .drawer-body table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
    .drawer-body th, .drawer-body td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; }
    .drawer-body th { background: var(--surface-2); }
    .tip {
      background: rgba(99, 102, 241, 0.1);
      border-left: 3px solid var(--accent);
      padding: 10px 12px;
      border-radius: 6px;
    }
    .drawer-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
    }
    .drawer-paused { color: var(--muted); font-size: 0.85rem; }

    /* ===== Fullscreen ===== */
    html.is-fullscreen { font-size: clamp(17px, 0.45vw + 11px, 22px); }
    html.is-fullscreen body { min-height: 100vh; }
    /* margin:auto centres the quiz vertically, but drops to 0 if content is taller than the screen */
    html.is-fullscreen .app { max-width: min(1280px, 94vw); margin-block: auto; }
    html.is-fullscreen .drawer { width: min(clamp(460px, 40vw, 760px), 100%); }
    ::backdrop { background: var(--bg); }

    /* ===== Results Screen ===== */
    .results-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      text-align: center;
      animation: slideIn 0.4s ease;
    }
    .results-card h2 { font-size: 1.6rem; margin-bottom: 4px; }
    .results-sub { color: var(--muted); margin-bottom: 20px; }
    .badge {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 18px 28px;
      border-radius: 16px;
      border: 2px solid var(--badge-color);
      background: color-mix(in srgb, var(--badge-color) 12%, transparent);
      margin-bottom: 22px;
      animation: pop 0.6s ease;
    }
    .badge-icon { font-size: 2.6rem; line-height: 1; }
    .badge-title { font-size: 1.25rem; font-weight: 700; color: var(--badge-color); }
    .badge-desc { font-size: 0.85rem; color: var(--muted); max-width: 320px; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-box {
      background: var(--surface-2);
      border-radius: 10px;
      padding: 14px 8px;
    }
    .stat-value { font-size: 1.5rem; font-weight: 700; font-family: var(--mono); }
    .stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }

    .section-title { text-align: left; font-size: 1rem; margin: 6px 0 10px; }
    .level-bars { text-align: left; margin-bottom: 22px; }
    .level-row { margin-bottom: 10px; }
    .level-row-top { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 4px; }
    .level-row-top .meta { color: var(--muted); font-family: var(--mono); }
    .bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; width: 0; background: var(--lvl-color); border-radius: 99px; transition: width 0.8s ease; }

    details.review { text-align: left; margin-bottom: 24px; }
    details.review summary { cursor: pointer; font-weight: 600; padding: 6px 0; }
    .review-list { list-style: none; margin-top: 8px; }
    .review-list li {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 8px 4px; border-bottom: 1px solid var(--border); font-size: 0.9rem;
    }
    .review-list .meta { color: var(--muted); white-space: nowrap; font-family: var(--mono); font-size: 0.8rem; }

    /* ===== Animations ===== */
    @keyframes pop     { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
    @keyframes shake   { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    @keyframes bump    { 0% { transform: scale(1); } 40% { transform: scale(1.5); color: var(--success); } 100% { transform: scale(1); } }
    @keyframes pulse   { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* ===== Responsive ===== */
    @media (max-width: 560px) {
      .options-grid { grid-template-columns: 1fr; }
      .header-bar { flex-wrap: wrap; font-size: 0.9rem; }
      .fs-label { display: none; }  /* icon only on phones */
      .header-right { margin-left: auto; }
      .action-bar .btn { flex: 1; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">

    <!-- ===== Header Bar ===== -->
    <header class="header-bar">
      <div class="stat" id="progress">Question <span id="current-num">1</span> of <span id="total-num">0</span></div>
      <div class="stat score">⭐ Score: <span id="score">0</span></div>
      <div class="header-right">
        <div class="stat timer" id="timer" title="Time left"><span id="timer-icon">⏱</span> <span id="timer-value">00:30</span></div>
        <button class="fs-btn" id="fs-btn" type="button" aria-pressed="false" title="Fullscreen (F)" hidden>
          <span class="fs-icon" id="fs-icon" aria-hidden="true">⛶</span><span class="fs-label" id="fs-label"> Fullscreen</span>
        </button>
      </div>
    </header>

    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

    <!-- ===== Quiz View ===== -->
    <main id="quiz-view">
      <section class="question-card" aria-live="polite">
        <div class="level-banner" id="level-banner" hidden></div>
        <div class="tags">
          <span class="tag level-tag" id="level-tag">Level 1</span>
          <span class="tag topic-tag" id="topic">Topic</span>
        </div>
        <div class="question-text" id="question-text">Loading question…</div>
      </section>

      <section class="options-grid" id="options-grid"></section>

      <p class="feedback" id="feedback" role="status"></p>

      <section class="action-bar">
        <button class="btn btn-secondary" id="hint-btn" type="button">💡 Hint / Read Lesson</button>
        <button class="btn btn-primary" id="next-btn" type="button" disabled>Next Question ➔</button>
      </section>
    </main>

    <!-- ===== Results View ===== -->
    <section id="results-view" hidden>
      <div class="results-card">
        <h2>🎉 Quiz Complete!</h2>
        <p class="results-sub" id="results-sub"></p>

        <div class="badge" id="badge">
          <span class="badge-icon" id="badge-icon"></span>
          <span class="badge-title" id="badge-title"></span>
          <span class="badge-desc" id="badge-desc"></span>
        </div>

        <div class="stats-grid">
          <div class="stat-box"><div class="stat-value" id="res-score"></div><div class="stat-label">Final Score</div></div>
          <div class="stat-box"><div class="stat-value" id="res-accuracy"></div><div class="stat-label">Accuracy</div></div>
          <div class="stat-box"><div class="stat-value" id="res-time"></div><div class="stat-label">Time Taken</div></div>
          <div class="stat-box"><div class="stat-value" id="res-first"></div><div class="stat-label">First Try</div></div>
        </div>

        <h3 class="section-title">Mastery by Level</h3>
        <div class="level-bars" id="level-bars"></div>

        <details class="review">
          <summary>Question-by-question review</summary>
          <ul class="review-list" id="review-list"></ul>
        </details>

        <button class="btn btn-primary" id="restart-btn" type="button">↻ Restart Quiz</button>
      </div>
    </section>
  </div>

  <!-- ===== Reading Drawer ===== -->
  <div class="drawer-overlay" id="drawer-overlay" hidden></div>
  <aside class="drawer" id="lesson-drawer" aria-hidden="true" aria-labelledby="drawer-title">
    <div class="drawer-header">
      <h2 id="drawer-title">📖 Lesson</h2>
      <button class="drawer-close" id="drawer-close" type="button" aria-label="Close lesson">✕</button>
    </div>
    <div class="drawer-hint" id="drawer-hint"></div>
    <div class="drawer-body" id="drawer-body"></div>
    <div class="drawer-footer">
      <span class="drawer-paused">⏸ Timer paused while you read</span>
      <button class="btn btn-primary" id="back-btn" type="button">← Back to Question</button>
    </div>
  </aside>

  <script>
  /* =========================================================
     CURRICULUM
     Each question: id, level (1–4), topic, question (HTML),
     options (4 plain strings), correctIndex (0–3), hint, lesson (HTML).
     In question/lesson HTML, write "<" as &lt; inside code.
     ========================================================= */
  const LEVELS = {
    1: { name: "Absolute Beginner",  color: "var(--lvl1)", icon: "🌱" },
    2: { name: "Attributes & Links", color: "var(--lvl2)", icon: "🔗" },
    3: { name: "Lists & Grouping",   color: "var(--lvl3)", icon: "📋" },
    4: { name: "Advanced Beginner",  color: "var(--lvl4)", icon: "🚀" },
  };

  const QUESTIONS = [
    /* ---------------- LEVEL 1: Absolute Beginner ---------------- */
    {
      id: 1, level: 1, topic: "DOCTYPE",
      question: `<p>What does this line at the very top of an HTML file do?</p>
<pre><code>&lt;!DOCTYPE html&gt;</code></pre>`,
      options: [
        "Creates the page's main heading",
        "Tells the browser the page uses modern HTML5",
        "Links a CSS stylesheet",
        "Sets the text shown in the browser tab",
      ],
      correctIndex: 1,
      hint: "It's a declaration about which version of HTML the document follows.",
      lesson: `
        <h3>The DOCTYPE declaration</h3>
        <p><code>&lt;!DOCTYPE html&gt;</code> is <strong>not an HTML tag</strong>. It is an instruction to the browser: <em>"read this page using the modern HTML5 rules."</em></p>
        <p>Without it, browsers fall back to <strong>"quirks mode"</strong>, an old compatibility mode where layouts can behave strangely.</p>
        <pre><code>&lt;!DOCTYPE html&gt;   &lt;!-- always line 1 --&gt;
&lt;html lang="en"&gt;
  ...
&lt;/html&gt;</code></pre>
        <ul>
          <li>It must be the <strong>very first line</strong> of the file.</li>
          <li>It is not case-sensitive, but lowercase <code>html</code> is the convention.</li>
          <li>It has no closing tag.</li>
        </ul>
        <p class="tip">💡 In most code editors, typing <code>!</code> and pressing Tab generates the whole starter skeleton, DOCTYPE included.</p>`,
    },
    {
      id: 2, level: 1, topic: "<html> root",
      question: `<p>Which element is the <strong>root</strong> that wraps all other content of an HTML page?</p>`,
      options: ["<body>", "<root>", "<html>", "<head>"],
      correctIndex: 2,
      hint: "It shares its name with the language itself.",
      lesson: `
        <h3>The root element</h3>
        <p>Every HTML page is a tree of elements. The top of that tree, the <strong>root</strong>, is <code>&lt;html&gt;</code>. Everything except the DOCTYPE lives inside it.</p>
        <pre><code>&lt;!DOCTYPE html&gt;
&lt;html lang="en"&gt;
  &lt;head&gt; ... &lt;/head&gt;
  &lt;body&gt; ... &lt;/body&gt;
&lt;/html&gt;</code></pre>
        <p>The <code>lang="en"</code> attribute tells browsers, search engines and screen readers which language the page is written in.</p>
        <p class="tip">💡 <code>&lt;html&gt;</code> has exactly two children: <code>&lt;head&gt;</code> and <code>&lt;body&gt;</code>.</p>`,
    },
    {
      id: 3, level: 1, topic: "<head> vs <body>",
      question: `<p>Where should the <code>&lt;title&gt;</code> element go?</p>
<pre><code>&lt;html&gt;
  &lt;head&gt; ??? &lt;/head&gt;
  &lt;body&gt; ??? &lt;/body&gt;
&lt;/html&gt;</code></pre>`,
      options: ["Inside <body>", "Inside <head>", "After </html>", "Inside an <h1>"],
      correctIndex: 1,
      hint: "The title shows in the browser tab, not on the page itself. Where does invisible information go?",
      lesson: `
        <h3>&lt;head&gt; vs &lt;body&gt;</h3>
        <table>
          <tr><th>&lt;head&gt;</th><th>&lt;body&gt;</th></tr>
          <tr><td>Information <em>about</em> the page</td><td>The content people <em>see</em></td></tr>
          <tr><td><code>&lt;title&gt;</code>, <code>&lt;meta&gt;</code>, <code>&lt;link&gt;</code>, <code>&lt;style&gt;</code></td><td>Headings, paragraphs, images, links, forms…</td></tr>
        </table>
        <pre><code>&lt;head&gt;
  &lt;meta charset="UTF-8"&gt;
  &lt;title&gt;My First Page&lt;/title&gt;  &lt;!-- shows in the tab --&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;h1&gt;Welcome!&lt;/h1&gt;              &lt;!-- shows on the page --&gt;
&lt;/body&gt;</code></pre>
        <p class="tip">💡 The <code>&lt;title&gt;</code> is also what appears in search results and bookmarks, so make it descriptive.</p>`,
    },
    {
      id: 4, level: 1, topic: "Headings",
      question: `<p>Which heading element is the <strong>largest and most important</strong> by default?</p>`,
      options: ["<h6>", "<heading>", "<h1>", "<head>"],
      correctIndex: 2,
      hint: "Headings are numbered by rank. Think \"number one\".",
      lesson: `
        <h3>Headings: &lt;h1&gt; to &lt;h6&gt;</h3>

  const BADGES = [
    { min: 90, icon: "🏆", title: "HTML Junior Dev",  color: "var(--success)", desc: "Outstanding! You're ready to build real pages. CSS is your next adventure." },
    { min: 70, icon: "🎓", title: "HTML Apprentice",  color: "var(--lvl2)",    desc: "Solid foundations. Review the levels below that aren't full yet to level up." },
    { min: 40, icon: "📘", title: "HTML Learner",     color: "var(--lvl1)",    desc: "Good progress! Re-read the lessons for questions you missed and try again." },
    { min: 0,  icon: "🌱", title: "HTML Novice",      color: "var(--warning)", desc: "Every expert started here. Open the lessons as you go; that's what they're for." },
  ];

  /* =========================================================
     STATE
     ========================================================= */
  const state = {
    index: 0,
    score: 0,
    answerState: "idle",   // "idle" | "correct" | "finished"
    drawerOpen: false,
    history: [],           // one entry per completed question
    q: null,               // per-question state, see newQuestionState()
  };

  function newQuestionState() {
    return {
      wrongAttempts: 0,
      hintOpened: false,
      timedOut: false,
      activeMs: 0,         // time spent with the question visible & unpaused
      runningSince: null,  // Date.now() when the clock last (re)started, or null if paused
    };
  }

  /* =========================================================
     DOM
     ========================================================= */
  const $ = (id) => document.getElementById(id);
  const els = {
    currentNum: $("current-num"), totalNum: $("total-num"), score: $("score"),
    timer: $("timer"), timerIcon: $("timer-icon"), timerValue: $("timer-value"),
    progressFill: $("progress-fill"),
    quizView: $("quiz-view"), resultsView: $("results-view"),
    levelBanner: $("level-banner"), levelTag: $("level-tag"), topic: $("topic"),
    questionText: $("question-text"), optionsGrid: $("options-grid"), feedback: $("feedback"),
    hintBtn: $("hint-btn"), nextBtn: $("next-btn"),
    drawer: $("lesson-drawer"), overlay: $("drawer-overlay"), drawerClose: $("drawer-close"),
    drawerHint: $("drawer-hint"), drawerBody: $("drawer-body"), backBtn: $("back-btn"),
    resultsSub: $("results-sub"), badge: $("badge"), badgeIcon: $("badge-icon"),
    badgeTitle: $("badge-title"), badgeDesc: $("badge-desc"),
    resScore: $("res-score"), resAccuracy: $("res-accuracy"), resTime: $("res-time"), resFirst: $("res-first"),
    levelBars: $("level-bars"), reviewList: $("review-list"), restartBtn: $("restart-btn"),
    fsBtn: $("fs-btn"), fsIcon: $("fs-icon"), fsLabel: $("fs-label"),
  };

  /* =========================================================
     CLOCK
     One stopwatch per question measures ACTIVE time only.
     The countdown display is derived from it:  left = limit − active.
     It runs only while: question unanswered, drawer closed, tab visible.
     So time spent reading the lesson never counts, for the countdown
     or for the "Total Time Taken" on the results screen.
     ========================================================= */
  const Clock = {
    tickId: null,

    canRun() {
      return state.answerState === "idle" && !state.drawerOpen && !document.hidden;
    },
    isRunning() {
      return state.q && state.q.runningSince !== null;
    },
    activeMs() {
      if (!state.q) return 0;
      return state.q.activeMs + (this.isRunning() ? Date.now() - state.q.runningSince : 0);
    },
    msLeft() {
      return Math.max(0, CONFIG.secondsPerQuestion * 1000 - this.activeMs());
    },
    /** Start if allowed (safe to call any time). */
    resume() {
      if (!state.q || this.isRunning() || !this.canRun()) return this.render();
      state.q.runningSince = Date.now();
      if (!this.tickId) this.tickId = setInterval(() => this.tick(), 250);
      this.render();
    },
    /** Bank the elapsed time and freeze. */
    pause() {
      if (this.isRunning()) {
        state.q.activeMs += Date.now() - state.q.runningSince;
        state.q.runningSince = null;
      }
      this.render();
    },
    tick() {
      if (state.answerState === "finished") return; // header shows the total time instead
      if (state.q && !state.q.timedOut && this.msLeft() === 0) onTimeUp();
      this.render();
    },
    render() {
      const secs = Math.ceil(this.msLeft() / 1000);
      els.timerValue.textContent = formatClock(secs);
      const cls = els.timer.classList;
      const idle = state.answerState === "idle";
      cls.toggle("done", !idle);
      cls.toggle("expired", idle && state.q && state.q.timedOut);
      cls.toggle("paused", idle && !this.isRunning() && !(state.q && state.q.timedOut));
      cls.toggle("low", idle && this.isRunning() && secs <= CONFIG.lowTimeThreshold && secs > 0);
      els.timerIcon.textContent = cls.contains("paused") ? "⏸" : cls.contains("done") ? "✔" : "⏱";
    },
  };

  function onTimeUp() {
    state.q.timedOut = true;
    setFeedback(`⏰ Time's up! You can still answer, for ${CONFIG.minPoints} point.`, "error");
  }

  /* =========================================================
     FULLSCREEN
     Standard Fullscreen API, with the webkit-prefixed versions for older Safari.
     The button stays hidden where fullscreen isn't available (e.g. iPhone Safari).
     ========================================================= */
  const Fullscreen = {
    supported: Boolean(document.fullscreenEnabled || document.webkitFullscreenEnabled),

    isOn() {
      return Boolean(document.fullscreenElement || document.webkitFullscreenElement);
    },

    async enter() {
      const el = document.documentElement;
      if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: "hide" });
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    },

    async exit() {
      if (document.exitFullscreen) await document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    },

    async toggle() {
      try {
        if (this.isOn()) await this.exit();
        else await this.enter();
      } catch (err) {
        console.warn("Fullscreen request failed:", err);
      }
    },

    /** Runs on every change, including leaving with Esc or the browser's own controls. */
    sync() {
      const on = this.isOn();
      document.documentElement.classList.toggle("is-fullscreen", on);
      els.fsBtn.setAttribute("aria-pressed", String(on));
      els.fsIcon.textContent = on ? "✕" : "⛶";
      els.fsLabel.textContent = on ? " Exit Fullscreen" : " Fullscreen";
      els.fsBtn.title = on ? "Exit fullscreen (F or Esc)" : "Fullscreen (F)";
      els.fsBtn.setAttribute("aria-label", on ? "Exit fullscreen" : "Enter fullscreen");
    },
  };

  /* =========================================================
     QUIZ FLOW
     ========================================================= */
  function renderQuestion() {
    const q = QUESTIONS[state.index];
    const lvl = LEVELS[q.level];
    const prev = QUESTIONS[state.index - 1];

    state.answerState = "idle";
    state.q = newQuestionState();

    // Header
    els.currentNum.textContent = state.index + 1;
    els.totalNum.textContent = QUESTIONS.length;
    els.score.textContent = state.score;
    els.progressFill.style.width = `${(state.index / QUESTIONS.length) * 100}%`;

    // Level styling + banner on the first question of each level
    els.quizView.style.setProperty("--lvl-color", lvl.color);
    els.levelTag.textContent = `Level ${q.level} · ${lvl.name}`;
    els.topic.textContent = q.topic;
    const newLevel = !prev || prev.level !== q.level;
    els.levelBanner.hidden = !newLevel;
    if (newLevel) {
      els.levelBanner.textContent = `${lvl.icon} Level ${q.level}: ${lvl.name}`;
    }

    // Question + options
    els.questionText.innerHTML = q.question;
    els.optionsGrid.innerHTML = "";
    q.options.forEach((text, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "option-btn";
      btn.dataset.index = i;
      const letter = document.createElement("span");
      letter.className = "option-letter";
      letter.textContent = CONFIG.letters[i];
      const label = document.createElement("span");
      label.className = "option-label";
      // Code-looking options (tags, attributes) get a monospace font
      if (/^<|^[a-z-]+="|^[a-z]+$/.test(text)) label.classList.add("is-code");
      label.textContent = text; // literal text, so "<nav>" shows as typed
      btn.append(letter, label);
      btn.addEventListener("click", () => checkAnswer(i));
      els.optionsGrid.appendChild(btn);
    });

    setFeedback("");
    els.hintBtn.disabled = false;
    els.timer.title = "Time left";
    els.nextBtn.disabled = true;
    els.nextBtn.textContent = state.index === QUESTIONS.length - 1 ? "See Results 🏁" : "Next Question ➔";

    els.drawerHint.textContent = `💡 Hint: ${q.hint}`;
    els.drawerBody.innerHTML = q.lesson;
    els.drawerBody.scrollTop = 0;

    Clock.resume();
  }

  function pointsForCurrent() {
    if (state.q.timedOut) return CONFIG.minPoints;
    return Math.max(CONFIG.minPoints, CONFIG.basePoints - state.q.wrongAttempts * CONFIG.wrongPenalty);
  }

  function checkAnswer(optionIndex) {
    if (state.answerState !== "idle" || state.drawerOpen) return;
    const q = QUESTIONS[state.index];
    const btn = els.optionsGrid.querySelector(`[data-index="${optionIndex}"]`);
    if (!btn || btn.disabled) return;

    if (optionIndex === q.correctIndex) {
      Clock.pause();                      // bank the active time first
      state.answerState = "correct";
      Clock.render();

      btn.classList.add("correct");
      els.optionsGrid.querySelectorAll(".option-btn").forEach((b) => (b.disabled = true));

      const points = pointsForCurrent();
      addScore(points);
      playTone(true);

      const perfect = state.q.wrongAttempts === 0 && !state.q.timedOut;
      setFeedback(`${perfect ? "🎉 Correct! First try!" : "✅ Correct!"} +${points} points`, "success");

      state.history.push({
        id: q.id, level: q.level, topic: q.topic, points,
        wrongAttempts: state.q.wrongAttempts,
        timedOut: state.q.timedOut,
        hintOpened: state.q.hintOpened,
        activeMs: state.q.activeMs,
      });

      els.nextBtn.disabled = false;
      els.nextBtn.focus();
    } else {
      state.q.wrongAttempts++;
      btn.classList.add("wrong");
      btn.disabled = true;
      playTone(false);
      setFeedback("❌ Not quite. Try again or read the hint!", "error");
    }
  }

  function nextQuestion() {
    if (state.answerState !== "correct") return;
    closeDrawer({ resume: false });
    if (state.index < QUESTIONS.length - 1) {
      state.index++;
      renderQuestion();
    } else {
      showResults();
    }
  }

  /* =========================================================
     LESSON DRAWER (pause / resume)
     ========================================================= */
  function openDrawer() {
    if (state.drawerOpen || state.answerState === "finished") return;
    state.drawerOpen = true;
    if (state.answerState === "idle") state.q.hintOpened = true;
    Clock.pause();                                  // ⏸ PAUSE RULE
    els.drawer.classList.add("open");
    els.drawer.setAttribute("aria-hidden", "false");
    els.overlay.hidden = false;
    els.backBtn.focus();
  }

  function closeDrawer({ resume = true } = {}) {
    if (!state.drawerOpen) return;
    state.drawerOpen = false;
    els.drawer.classList.remove("open");
    els.drawer.setAttribute("aria-hidden", "true");
    els.overlay.hidden = true;
    if (resume) {
      if (state.answerState === "idle") els.hintBtn.focus();
      Clock.resume();                               // ▶ RESUME RULE
    }
  }

  /* =========================================================
     RESULTS
     ========================================================= */
  function showResults() {
    state.answerState = "finished";
    Clock.render();
    els.progressFill.style.width = "100%";

    const total = QUESTIONS.length;
    const maxScore = total * CONFIG.basePoints;
    const wrongTotal = state.history.reduce((s, h) => s + h.wrongAttempts, 0);
    const firstTry = state.history.filter((h) => h.wrongAttempts === 0 && !h.timedOut).length;
    const accuracy = Math.round((total / (total + wrongTotal)) * 100); // correct picks ÷ all picks
    const totalMs = state.history.reduce((s, h) => s + h.activeMs, 0);
    const scorePct = (state.score / maxScore) * 100;
    const badge = BADGES.find((b) => scorePct >= b.min);

    // Swap views
    els.quizView.hidden = true;
    els.resultsView.hidden = false;
    els.currentNum.textContent = total;
    els.timerValue.textContent = formatDuration(totalMs);
    els.timer.title = "Total active time";

    // Headline numbers
    els.resultsSub.textContent =
      `You answered all ${total} questions. Reading time in the lessons is not counted.`;
    els.resScore.textContent = `${state.score}/${maxScore}`;
    els.resAccuracy.textContent = `${accuracy}%`;
    els.resTime.textContent = formatDuration(totalMs);
    els.resFirst.textContent = `${firstTry}/${total}`;

    // Badge
    els.badge.style.setProperty("--badge-color", badge.color);
    els.badgeIcon.textContent = badge.icon;
    els.badgeTitle.textContent = badge.title;
    els.badgeDesc.textContent = badge.desc;

    // Per-level mastery bars
    els.levelBars.innerHTML = "";
    Object.entries(LEVELS).forEach(([lvlNum, lvl]) => {
      const items = state.history.filter((h) => h.level === Number(lvlNum));
      if (!items.length) return;
      const got = items.reduce((s, h) => s + h.points, 0);
      const max = items.length * CONFIG.basePoints;
      const pct = Math.round((got / max) * 100);
      const row = document.createElement("div");
      row.className = "level-row";
      row.style.setProperty("--lvl-color", lvl.color);
      row.innerHTML = `
        <div class="level-row-top">
          <span>${lvl.icon} Level ${lvlNum}: ${escapeHTML(lvl.name)}</span>
          <span class="meta">${got}/${max} · ${pct}%</span>
        </div>
        <div class="bar"><div class="bar-fill"></div></div>`;
      els.levelBars.appendChild(row);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        row.querySelector(".bar-fill").style.width = pct + "%";
      }));
    });

    // Review list
    els.reviewList.innerHTML = state.history
      .map((h, i) => {
        const marks = [
          h.wrongAttempts ? `${h.wrongAttempts}✗` : "",
          h.hintOpened ? "💡" : "",
          h.timedOut ? "⏰" : "",
        ].filter(Boolean).join(" ");
        return `<li>
          <span>${i + 1}. ${escapeHTML(h.topic)}</span>
          <span class="meta">${marks ? marks + " · " : ""}${formatDuration(h.activeMs)} · ${h.points} pts</span>
        </li>`;
      })
      .join("");

    els.restartBtn.focus();
  }

  function restartQuiz() {
    closeDrawer({ resume: false });
    state.index = 0;
    state.score = 0;
    state.history = [];
    els.resultsView.hidden = true;
    els.quizView.hidden = false;
    renderQuestion();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* =========================================================
     HELPERS
     ========================================================= */
  function setFeedback(message, type = "") {
    els.feedback.textContent = message;
    els.feedback.className = `feedback ${type}`.trim();
  }

  function addScore(points) {
    state.score += points;
    els.score.textContent = state.score;
    els.score.classList.remove("score-bump");
    void els.score.offsetWidth; // restart the animation
    els.score.classList.add("score-bump");
  }

  function formatClock(totalSecs) {
    const m = String(Math.floor(totalSecs / 60)).padStart(2, "0");
    const s = String(totalSecs % 60).padStart(2, "0");
    return `${m}:${s}`;
  }

  function formatDuration(ms) {
    const secs = Math.round(ms / 1000);
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    return m ? `${m}m ${String(s).padStart(2, "0")}s` : `${s}s`;
  }

  function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  let audioCtx = null;
  function playTone(correct) {
    if (!CONFIG.sound) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const now = audioCtx.currentTime;
      osc.type = correct ? "sine" : "square";
      osc.frequency.setValueAtTime(correct ? 660 : 180, now);
      if (correct) osc.frequency.linearRampToValueAtTime(990, now + 0.15);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + (correct ? 0.3 : 0.2));
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.3);
    } catch (_) { /* no audio, visual feedback is enough */ }
  }

  /* =========================================================
     EVENTS
     ========================================================= */
  els.hintBtn.addEventListener("click", openDrawer);
  els.drawerClose.addEventListener("click", () => closeDrawer());
  els.backBtn.addEventListener("click", () => closeDrawer());
  els.overlay.addEventListener("click", () => closeDrawer());
  els.nextBtn.addEventListener("click", nextQuestion);
  els.restartBtn.addEventListener("click", restartQuiz);

  if (Fullscreen.supported) {
    els.fsBtn.hidden = false;
    els.fsBtn.addEventListener("click", () => Fullscreen.toggle());
    document.addEventListener("fullscreenchange", () => Fullscreen.sync());
    document.addEventListener("webkitfullscreenchange", () => Fullscreen.sync());
    Fullscreen.sync();
  }

  // Don't count time while the tab is hidden
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) Clock.pause();
    else Clock.resume();
  });

  // Keyboard: A–D / 1–4 answer · H lesson · F fullscreen · Esc close · Enter next/restart
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") return closeDrawer();
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if ((e.key === "f" || e.key === "F") && Fullscreen.supported && !e.repeat) return Fullscreen.toggle();
    if (state.drawerOpen) return;
    if (state.answerState === "finished") {
      if (e.key === "Enter" && document.activeElement !== els.restartBtn) restartQuiz();
      return;
    }
    const key = e.key.length === 1 ? e.key.toUpperCase() : "";
    let idx = CONFIG.letters.indexOf(key);
    if (idx === -1) idx = key ? "1234".indexOf(key) : -1;

    if (idx !== -1) checkAnswer(idx);
    else if (key === "H" && state.answerState === "idle") openDrawer();
    else if (e.key === "Enter" && !els.nextBtn.disabled && document.activeElement !== els.nextBtn) nextQuestion();
  });

  /* =========================================================
     INIT
     ========================================================= */
  (function validateQuestions() {
    QUESTIONS.forEach((q) => {
      if (q.options.length !== 4 || q.correctIndex < 0 || q.correctIndex > 3 || !LEVELS[q.level]) {
        console.warn("Check question data:", q.id);
      }
    });
  })();

  renderQuestion();
  </script>
</body>
</html>
